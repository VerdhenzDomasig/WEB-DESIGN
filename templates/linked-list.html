<!DOCTYPE html>
<html lang="en">
  <!-- Page setup: title, mobile view, CSS at JavaScript files. -->
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Linked List | VERDHENZ </title>
    <meta name="description" content="My programming portfolio and interactive tools.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ed4aaa'/%3E%3Ctext x='6' y='24' font-size='25' fill='white'%3E♡%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer>
    </script>
  </head>
  <body>
<!-- Chrome frame at pink-blue title bar ng UI. -->
    <!-- Chrome frame na bumabalot sa buong website UI. -->
    <div class="site-window">
      <!-- animated background behind all content. -->
      <video class="video-background" autoplay muted loop playsinline aria-hidden="true" preload="auto">
        <source src="{{ url_for('static', filename='assets/background.mp4') }}" type="video/mp4">
      </video>
      <!-- Y2K title bar; decorative lang ang window controls. -->
      <div class="window-titlebar">
        <span>verdhenz.online</span>
        <span class="window-controls" aria-hidden="true">
          <span>−</span><span>□</span><span>×</span>
        </span>
      </div>
    <!-- Website brand at main navigation. -->
    <header>
      <!-- Website name na tugma sa theme. -->
      <a class="brand" href="{{ url_for('index') }}">VERDHENZ <span aria-hidden="true">✧</span></a>
      <!-- Mga link papuntang Home, Profile, Works at Contact. -->
      <nav aria-label="Main navigation">
        <a class="" href="{{ url_for('index') }}">Home</a>
        <a class="" href="{{ url_for('profile') }}">Profile</a>
        <a class="active" href="{{ url_for('works') }}">Works</a>
        <a class="" href="{{ url_for('contact') }}">Contact</a>
      </nav>
    </header>
    <!-- Main content ng page na ito. -->
    <main>
      <!-- Section na ito: tool. -->
      <section class="tool">
        <a class="back" href="{{ url_for('works') }}">‹ Back to Works</a>
        <div class="card">
          <div class="symbol">⛓</div>
          <!-- Main heading ng page. -->
          <h1 class="page-title">Linked List</h1>
          <!-- Input form; app.js ang humahawak sa submission. -->
          <form id="linked-list" novalidate>
            <!-- Pangalan ng field; for attribute ang koneksyon sa input. -->
            <label for="value">Node value</label>
            <!-- User input; id ang ginagamit ng app.js para basahin ang value. -->
            <input id="value" placeholder="e.g. 10">
            <!-- Position starts at 1; use this for middle insertion. -->
            <!-- Pangalan ng field; for attribute ang koneksyon sa input. -->
            <label for="position">Position (for Insert at Position)</label>
            <!-- User input; id ang ginagamit ng app.js para basahin ang value. -->
            <input
              id="position"
              type="number"
              min="1"
              step="1"
              placeholder="e.g. 2"
              aria-describedby="position-help"
            >
            <!-- Description o message na binabasa ng visitor. -->
            <p id="position-help" class="muted">
              Positions start at 1. Example: insert 20 at position 2 in 10 → 30
              to get 10 → 20 → 30.
            </p>
            <!-- Grupo ng buttons o navigation links. -->
            <div class="actions">
              <!-- Action button; type o data-action ang nagtatakda ng gagawin. -->
              <button type="button" data-action="append">Insert at End</button>
              <!-- Action button; type o data-action ang nagtatakda ng gagawin. -->
              <button type="button" data-action="prepend">Insert at Start</button>
              <!-- New middle/position insertion button. -->
              <!-- Action button; type o data-action ang nagtatakda ng gagawin. -->
              <button type="button" data-action="insert">Insert at Position</button>
              <!-- Action button; type o data-action ang nagtatakda ng gagawin. -->
              <button type="button" data-action="delete" class="outline">Delete Value</button>
              <!-- Action button; type o data-action ang nagtatakda ng gagawin. -->
              <button type="button" data-action="search" class="outline">Search</button>
              <!-- Action button; type o data-action ang nagtatakda ng gagawin. -->
              <button type="button" data-action="clear" class="outline">Clear List</button>
            </div>
            <!-- Dito iginuguhit ng app.js ang linked list nodes. -->
            <div id="nodes" class="nodes" aria-label="Linked list">
            </div>
          </form>
          <div class="result" aria-live="polite" aria-atomic="true">
            <span>Result</span>
            <!-- Dito inilalagay ng app.js ang sagot o error message. -->
            <strong id="output">Your list is empty.</strong>
          </div>
        </div>
      </section>
    </main>
    <!-- Footer signature sa ilalim ng page. -->
    <footer>AVER♡</footer>
    </div><!-- Dulo ng UI frame. -->
  </body>
</html>
